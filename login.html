<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Login - SDN 1 Bangunharjo Academic Progress</title>
    <link href="https://fonts.googleapis.com/css2?family=Comic+Neue:wght@700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css" />
</head>
<body class="bg-gradient-to-br from-yellow-200 via-pink-200 to-purple-300 font-sans" style="font-family: 'Comic Neue', cursive;">
    <div class="min-h-screen flex items-center justify-center px-4">
        <div class="bg-white bg-opacity-90 backdrop-blur-md p-8 rounded-3xl shadow-lg w-full max-w-md border-4 border-pink-400">
            <h1 class="text-3xl font-extrabold mb-8 text-center text-pink-600 drop-shadow-lg">Login SDN 1 Bangunharjo</h1>
            <form id="loginForm" class="space-y-6">
                <div>
                    <label for="username" class="block text-pink-700 font-semibold mb-2">Username</label>
                    <input type="text" id="username" name="username" required
                        class="w-full px-4 py-3 border-2 border-pink-300 rounded-xl focus:outline-none focus:ring-4 focus:ring-pink-400 transition" />
                </div>
                <div>
                    <label for="password" class="block text-pink-700 font-semibold mb-2">Password</label>
                    <input type="password" id="password" name="password" required
                        class="w-full px-4 py-3 border-2 border-pink-300 rounded-xl focus:outline-none focus:ring-4 focus:ring-pink-400 transition" />
                </div>
                <button type="submit"
                    class="w-full bg-pink-500 text-white py-3 rounded-xl hover:bg-pink-600 transition-shadow shadow-md hover:shadow-lg font-bold text-lg">
                    Login
                </button>
                <p id="errorMsg" class="text-red-600 mt-2 hidden"></p>
            </form>
            <div class="mt-6 text-center">
                <img src="https://images.unsplash.com/photo-1503676260728-1c00da094a0b?auto=format&fit=crop&w=400&q=80" alt="Kids studying" class="mx-auto rounded-xl shadow-lg" />
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
