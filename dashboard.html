<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dashboard - SDN 1 Bangunharjo Academic Progress</title>
    <link href="https://fonts.googleapis.com/css2?family=Comic+Neue:wght@700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css" />
</head>
<body class="bg-gradient-to-br from-yellow-200 via-pink-200 to-purple-300 font-sans" style="font-family: 'Comic Neue', cursive;">
    <header class="bg-pink-500 text-white p-4 flex justify-between items-center shadow-lg">
        <h1 class="text-2xl font-extrabold drop-shadow-lg">SDN 1 Bangunharjo Academic Progress</h1>
        <button id="logoutBtn" class="hover:underline font-semibold">Logout</button>
    </header>
    <main class="p-6 max-w-7xl mx-auto">
        <section id="dashboardContent" class="bg-white bg-opacity-90 backdrop-blur-md rounded-3xl p-6 shadow-lg border-4 border-pink-400">
            <!-- Content will be dynamically loaded based on user role -->
        </section>
    </main>
    <footer class="text-center p-4 text-pink-700 font-semibold">
        &copy; 2024 SDN 1 Bangunharjo. All rights reserved.
    </footer>
    <script src="script.js"></script>
</body>
</html>
